# 로컬 Supabase CLI(`pnpm exec supabase start`) 설정. 개발·E2E의 Auth 전용이다(스펙 "테스트 결정" 2).
# 앱 데이터는 이 스택의 Postgres가 아니라 pgvector 컨테이너(pnpm test:db, CI 서비스 컨테이너)에 둔다.
# 인증은 이메일·비밀번호만 켜고 Kakao·Google은 끈다(제공자 동의·콜백은 배포 스모크에서 수동 확인).
# Auth에 필요 없는 서비스(Studio·Storage·Realtime·Edge·Analytics·메일)는 끈다.
project_id = "ai-news-platform"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
# 개발 서버(3000). 로그인은 앱 직접 OIDC → signInWithIdToken이라 Supabase 리디렉션 허용 목록을 쓰지 않는다.
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# 스펙 "계정": 익명 Supabase 사용자를 만들지 않는다.
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6

# E2E가 테스트마다 사용자를 만들고 로그인한다(브라우저 셋 × 재시도). 기본 한도(5분 30회)를 넘지 않게 넓힌다.
[auth.rate_limit]
sign_in_sign_ups = 1000
token_refresh = 1000

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.sms]
enable_signup = false

[auth.external.kakao]
enabled = false

[auth.external.google]
enabled = false
